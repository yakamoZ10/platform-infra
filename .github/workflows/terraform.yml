# Terraform CI/CD for envs/dev
#
#   PR to main   -> static checks -> plan (read-only SA) -> plan posted as PR comment
#   push to main -> static checks -> plan + apply (apply SA, only works from main)
#
# The bootstrap layer is NOT applied by CI on purpose (it holds CI's own
# identity - a pipeline must not be able to lock itself out).
#
# Required repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#   GCP_WIF_PROVIDER, GCP_TF_PLAN_SA, GCP_TF_APPLY_SA  (from `terraform output` in bootstrap)
#   TF_ADMIN_CIDRS   e.g. ["203.0.113.7/32"]
#
# Hardening tip: pin every action to a full commit SHA instead of a tag.
name: terraform

on:
  pull_request:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml", ".tflint.hcl", ".checkov.yaml"]
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Never run two plans/applies against the same state at once.
concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.8" # keep equal to (or newer than) your local `terraform -version`
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  WORKDIR: terraform/envs/dev

jobs:
  static:
    name: fmt · validate · tflint · checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform

      - name: terraform validate (all roots)
        run: |
          for dir in terraform/bootstrap terraform/envs/dev; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when downloading plugins
        run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config="$GITHUB_WORKSPACE/.tflint.hcl" --format=compact

      - name: checkov
        run: |
          pip install --quiet checkov
          checkov -d terraform --config-file .checkov.yaml

  plan:
    name: plan (PR)
    if: github.event_name == 'pull_request'
    needs: static
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for Workload Identity Federation
      pull-requests: write # post the plan as a comment
    env:
      TF_VAR_admin_cidrs: ${{ vars.TF_ADMIN_CIDRS }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_PLAN_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform -chdir="$WORKDIR" init

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform -chdir="$WORKDIR" plan -lock-timeout=5m -no-color -detailed-exitcode -out=tfplan
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then exit 1; fi
          terraform -chdir="$WORKDIR" show -no-color tfplan > plan.txt

      - name: comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const max = 60000;
            let plan = fs.readFileSync('plan.txt', 'utf8');
            if (plan.length > max) plan = plan.slice(0, max) + '\n\n... (truncated, see job log)';
            const changed = '${{ steps.plan.outputs.exitcode }}' === '2';
            const body = [
              `### Terraform plan · \`envs/dev\` ${changed ? '— changes detected' : '— no changes'}`,
              '<details><summary>Show plan</summary>',
              '',
              '```hcl',
              plan,
              '```',
              '</details>',
              '',
              `_Triggered by @${context.actor} · ${context.sha.substring(0, 7)}_`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  apply:
    name: apply (main)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: static
    runs-on: ubuntu-latest
    # Create a GitHub environment "dev" (optionally with required reviewers
    # for a manual approval gate before apply).
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_admin_cidrs: ${{ vars.TF_ADMIN_CIDRS }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_APPLY_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform -chdir="$WORKDIR" init

      - name: terraform plan
        run: terraform -chdir="$WORKDIR" plan -lock-timeout=5m -no-color -out=tfplan

      - name: terraform apply
        run: terraform -chdir="$WORKDIR" apply -lock-timeout=5m -no-color tfplan
